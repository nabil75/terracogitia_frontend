<h2 mat-dialog-title>{{ 'dashboard.radarDialogTitle' | translate }}</h2>

<mat-dialog-content class="radar-theme-dialog-content">
  <button
    mat-stroked-button
    type="button"
    class="radar-theme-option"
    [class.radar-theme-option--active]="data.selectedId === ''"
    (click)="choose('')"
  >
    <mat-icon aria-hidden="true">apps</mat-icon>
    <span>{{ 'dashboard.radarAllThemes' | translate }}</span>
  </button>

  @for (opt of data.options; track opt.id) {
    <button
      mat-stroked-button
      type="button"
      class="radar-theme-option"
      [class.radar-theme-option--active]="data.selectedId === opt.id"
      (click)="choose(opt.id)"
    >
      <mat-icon aria-hidden="true">category</mat-icon>
      <span>{{ opt.label }}</span>
    </button>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="undefined">
    {{ 'common.cancel' | translate }}
  </button>
</mat-dialog-actions>
