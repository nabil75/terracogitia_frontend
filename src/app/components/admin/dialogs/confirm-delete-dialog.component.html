<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="confirm-body">
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ 'confirmDeleteDialog.cancel' | translate }}</button>
  <button mat-flat-button color="warn" type="button" (click)="confirm()">
    {{ 'confirmDeleteDialog.confirm' | translate }}
  </button>
</mat-dialog-actions>
